name: ruhun_parliyor
description: Yapay zekâ destekli manifestasyon, günlük farkındalık ve kişisel spiritüel rehberlik uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.3.2
  home_widget: ^0.9.2+1

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Internationalization
  intl: ^0.20.0

  # Sharing / Export
  share_plus: ^10.0.2

  # Biometrics / App Lock
  local_auth: ^2.3.0

  # Icons
  phosphor_flutter: ^2.1.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Animation
  flutter_animate: ^4.5.0

  # Utils
  equatable: ^2.0.5
  uuid: ^4.4.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/fonts/
    - assets/cat/
    - assets/gems/
    - assets/animals/
    - assets/hero/
    - assets/themes/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
